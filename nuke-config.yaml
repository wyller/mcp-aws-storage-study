# aws-nuke v3 — cleanup of the study account.
# Everything that does NOT match a filter below is deleted, in every enabled region.
# The claude-cleanup-role policy denies touching the protected items anyway;
# these filters only avoid attempts (and AccessDenied noise).

# At least 1 blocked account is required. Fake account: the real lock is the alias below.
blocklist:
  - "999999999999"

# Refuses to run if the account alias contains any of these terms (besides the default "prod").
blocklist-terms:
  - "prod"
  - "production"
  - "live"

regions:
  - all

accounts:
  "004009722521": # expected alias: wyller-estudos
    presets:
      - human-access
      - vpc-default

presets:
  human-access:
    filters:
      IAMUser:
        - "readonly-user"
      IAMUserPolicyAttachment:
        - property: UserName
          value: "readonly-user"
      IAMUserAccessKey:
        - property: UserName
          value: "readonly-user"
      IAMLoginProfile:
        - property: UserName
          value: "readonly-user"
      IAMUserMFADevice:
        - property: UserName
          value: "readonly-user"
      # Includes the root MFA.
      IAMVirtualMFADevice:
        - type: glob
          value: "*"
      IAMRole:
        - "claude-cleanup-role"
        - "terraform-lab-role"
        # Lab role reused between days (EC2 reading S3); it stays, unlike the other lab-* roles.
        - "lab-s3-read-role"
        # SSM role for the EC2 labs (terraform/iam-compartilhado stack); it stays too.
        - "lab-storage-ec2-ssm"
      IAMRolePolicyAttachment:
        - property: RoleName
          value: "claude-cleanup-role"
        - property: RoleName
          value: "terraform-lab-role"
        - property: RoleName
          value: "lab-s3-read-role"
        - property: RoleName
          value: "lab-storage-ec2-ssm"
      IAMInstanceProfile:
        - "lab-s3-read-role"
        - "lab-storage-ec2-profile"
      IAMInstanceProfileRole:
        - property: InstanceProfile
          value: "lab-s3-read-role"
        - property: InstanceProfile
          value: "lab-storage-ec2-profile"
      IAMRolePolicy:
        - property: "role:RoleName"
          value: "claude-cleanup-role"
        - property: "role:RoleName"
          value: "terraform-lab-role"
      IAMPolicy:
        - "arn:aws:iam::004009722521:policy/CustomS3CreateBucket"
        - "arn:aws:iam::004009722521:policy/CustomS3DeleteBucket"
        - "arn:aws:iam::004009722521:policy/claude-cleanup-delete-only"
        - "arn:aws:iam::004009722521:policy/terraform-lab-iam-lab-roles"
        # Replication permissions for lab-s3-repl-* roles; kept between days, like the allow-list it is on.
        - "arn:aws:iam::004009722521:policy/lab-s3-replication"
      BudgetsBudget:
        - property: Name
          value: "My Monthly Cost Budget"

  # Default VPCs cost nothing and are a prerequisite for quick EC2/EFS/DataSync labs.
  vpc-default:
    filters:
      EC2VPC:
        - property: IsDefault
          value: "true"
      EC2Subnet:
        - property: DefaultVPC
          value: "true"
      EC2InternetGateway:
        - property: DefaultVPC
          value: "true"
      EC2InternetGatewayAttachment:
        - property: DefaultVPC
          value: "true"
      EC2RouteTable:
        - property: DefaultVPC
          value: "true"
      EC2DHCPOption:
        - property: DefaultVPC
          value: "true"
      EC2DefaultSecurityGroupRule:
        - property: DefaultVPC
          value: "true"

resource-types:
  excludes:
    # S3Bucket already empties the bucket (objects and versions); listing object by object only slows it down.
    - S3Object
    # Account setting, not a study resource.
    - IAMAccountSettingPasswordPolicy
    # Service-linked roles: AWS manages them; IAMRole already ignores them by default.

settings:
  EC2Instance:
    DisableDeletionProtection: true
    DisableStopProtection: true
  EC2Image:
    DisableDeregistrationProtection: true
    IncludeDisabled: true
    IncludeDeprecated: true
  RDSInstance:
    DisableDeletionProtection: true
  CloudFormationStack:
    DisableDeletionProtection: true
  ELBv2:
    DisableDeletionProtection: true
  DynamoDBTable:
    DisableDeletionProtection: true
  S3Bucket:
    BypassGovernanceRetention: true
    RemoveObjectLegalHold: true
